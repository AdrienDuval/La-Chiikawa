  <rect x="608" y="682" width="160" height="78" rx="10" fill="#FFFFFF" stroke="#F08C00" stroke-width="1.4"/>
  <text x="620" y="706" class="h14">Grafana</text>
  <text x="620" y="726" class="b">dashboards:</text>
  <text x="620" y="743" class="b">metrics + PostgreSQL</text>

  <rect x="808" y="682" width="160" height="78" rx="10" fill="#FFF5F5" stroke="#E03131" stroke-width="1.4"/>
  <text x="820" y="706" class="h14">Alertmanager</text>
  <text x="820" y="726" class="b">routes alerts</text>
  <text x="820" y="743" class="b">to the team</text>

