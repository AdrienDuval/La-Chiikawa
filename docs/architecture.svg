<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="916" viewBox="0 0 1360 916" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">La Chiikawa architecture</title>
  <desc id="desc">Sixteen publishers feed an hourly Airflow collection task. New items land as Parquet files in the bronze bucket of Garage object storage, are cleaned into silver at 06:00, grouped into topics with BERTopic using the live MLflow model, and published before 07:00 as an edition JSON in gold, which a static Next.js website served by nginx reads. PostgreSQL keeps small state. Prometheus, Grafana and Alertmanager watch every part, and Healthchecks.io checks from outside that the edition was published.</desc>

  <defs>
    <marker id="m-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E293B"/></marker>
    <marker id="m-run" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="m-metric" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868E96"/></marker>
    <marker id="m-alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker>
  </defs>

  <style>
    .title{font-size:26px;font-weight:700;fill:#1E293B}
    .sub{font-size:14px;fill:#475569}
    .h{font-size:15px;font-weight:700;fill:#1E293B}
    .h14{font-size:14px;font-weight:700;fill:#1E293B}
    .b{font-size:12.5px;fill:#334155}
    .lbl{font-size:12px;fill:#475569}
    .cap{font-size:11px;font-weight:700;letter-spacing:1px;fill:#64748B}
    .chip{font-size:11px;font-weight:600}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
    .badge{font-size:12px;font-weight:700;fill:#FFFFFF}
    .data{stroke:#1E293B;stroke-width:2;fill:none}
    .run{stroke:#334155;stroke-width:1.6;fill:none}
    .metric{stroke:#868E96;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
    .alert{stroke:#E03131;stroke-width:2;fill:none}
  </style>

  <rect x="0" y="0" width="1360" height="916" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="38" y="48" class="title">La Chiikawa · architecture</text>
  <text x="38" y="74" class="sub">Six parts (1 to 6), what flows between them, and where they run · v1 · 19 Oct 2026</text>

  <!-- Legend -->
  <rect x="820" y="29" width="14" height="14" rx="3" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.5"/>
  <text x="840" y="41" class="lbl">Airflow task</text>
  <rect x="937" y="29" width="10" height="14" rx="2" fill="#FBF1E7" stroke="#B5651D"/>
  <rect x="949" y="29" width="10" height="14" rx="2" fill="#F1F3F5" stroke="#868E96"/>
  <rect x="961" y="29" width="10" height="14" rx="2" fill="#FFF9DB" stroke="#D4A017"/>
  <text x="977" y="41" class="lbl">storage layer</text>
  <rect x="1080" y="29" width="14" height="14" rx="3" fill="#FFF8F0" stroke="#F08C00" stroke-width="1.5"/>
  <text x="1100" y="41" class="lbl">monitoring</text>
  <rect x="1184" y="29" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1204" y="41" class="lbl">outside our machine</text>

  <line x1="820" y1="63" x2="846" y2="63" class="data" marker-end="url(#m-data)"/>
  <text x="854" y="67" class="lbl">data</text>
  <line x1="900" y1="63" x2="926" y2="63" class="metric" marker-end="url(#m-metric)"/>
  <text x="934" y="67" class="lbl">metrics and checks</text>
  <line x1="1069" y1="63" x2="1095" y2="63" class="alert" marker-end="url(#m-alert)"/>
  <text x="1103" y="67" class="lbl">alerts</text>
  <circle cx="1170" cy="63" r="9" fill="#3B5BDB"/>
  <text x="1170" y="67" class="badge" text-anchor="middle" style="font-size:11px">1</text>
  <text x="1186" y="67" class="lbl">the six parts</text>

  <!-- Outside: top band -->
  <rect x="38" y="100" width="130" height="68" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="50" y="124" class="h14">GitHub</text>
  <text x="50" y="143" class="b">Actions CI:</text>
  <text x="50" y="160" class="b">tests, images</text>

  <rect x="208" y="100" width="360" height="68" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="222" y="124" class="h14">16 publishers</text>
  <text x="222" y="143" class="b">8 national · 8 regional · listed in sources.csv</text>
  <text x="222" y="160" class="b">RSS feeds + news sitemaps · robots.txt respected</text>

  <rect x="808" y="100" width="360" height="68" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="822" y="124" class="h14">Healthchecks.io · outside check</text>
  <text x="822" y="143" class="b">no ping by 07:05 → alert by email · Discord</text>
  <text x="822" y="160" class="b">still works if our machine is down</text>

  <!-- Our machine -->
  <rect x="20" y="186" width="1166" height="706" rx="16" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="38" y="878"><tspan class="cap">ONE MACHINE · DOCKER COMPOSE</tspan><tspan class="lbl" dx="10">course servers from TD 4/6 · everything described in code</tspan></text>

  <!-- Row A: Airflow and its tasks -->
  <rect x="38" y="236" width="130" height="150" rx="12" fill="#F1F5F9" stroke="#334155" stroke-width="1.6"/>
  <text x="50" y="262" class="h">Airflow 3</text>
  <text x="50" y="286" class="b">runs blue tasks</text>
  <text x="50" y="303" class="b">collect hourly</text>
  <text x="50" y="320" class="b">merge nightly</text>
  <text x="50" y="337" class="b">edition 06:00</text>
  <rect x="50" y="352" width="72" height="20" rx="10" fill="#E2E8F0"/>
  <text x="86" y="366" class="chip" text-anchor="middle" fill="#334155">scheduler</text>

  <rect x="208" y="236" width="160" height="150" rx="12" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.6"/>
  <circle cx="226" cy="257" r="11" fill="#3B5BDB"/>
  <text x="226" y="261.5" class="badge" text-anchor="middle">1</text>
