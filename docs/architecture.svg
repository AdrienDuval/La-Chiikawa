  <text x="220" y="286" class="b">RSS + news sitemaps</text>
  <text x="220" y="303" class="b">1 task per source,</text>
  <text x="220" y="320" class="b">in parallel, retries</text>
  <text x="220" y="337" class="b">robots.txt first</text>
  <rect x="220" y="352" width="78" height="20" rx="10" fill="#E0E7FF"/>
  <text x="259" y="366" class="chip" text-anchor="middle" fill="#3B5BDB">every hour</text>
  <rect x="304" y="352" width="47" height="20" rx="10" fill="#EEF1F5"/>
  <text x="327.5" y="366" class="chip" text-anchor="middle" fill="#475569">httpx</text>

  <rect x="408" y="236" width="160" height="150" rx="12" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.6"/>
  <circle cx="426" cy="257" r="11" fill="#3B5BDB"/>
  <text x="426" y="261.5" class="badge" text-anchor="middle">3</text>
  <text x="444" y="262" class="h">Cleaning &amp;</text>
  <text x="444" y="280" class="h">quality</text>
  <text x="420" y="303" class="b">normalize, dedupe</text>
  <text x="420" y="320" class="b">check quality rules</text>
  <text x="420" y="337" class="b">write a report</text>
  <rect x="420" y="352" width="47" height="20" rx="10" fill="#E0E7FF"/>
  <text x="443.5" y="366" class="chip" text-anchor="middle" fill="#3B5BDB">06:00</text>
  <rect x="473" y="352" width="53" height="20" rx="10" fill="#EEF1F5"/>
  <text x="499.5" y="366" class="chip" text-anchor="middle" fill="#475569">DuckDB</text>

  <rect x="608" y="236" width="160" height="150" rx="12" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.6"/>
  <circle cx="626" cy="257" r="11" fill="#3B5BDB"/>
  <text x="626" y="261.5" class="badge" text-anchor="middle">4</text>
  <text x="644" y="262" class="h">Topics</text>
  <text x="620" y="286" class="b">groups the day's</text>
  <text x="620" y="303" class="b">articles, names them</text>
  <text x="620" y="320" class="b">falls back to the</text>
  <text x="620" y="337" class="b">previous model</text>
  <rect x="620" y="352" width="47" height="20" rx="10" fill="#E0E7FF"/>
  <text x="643.5" y="366" class="chip" text-anchor="middle" fill="#3B5BDB">06:00</text>
  <rect x="673" y="352" width="66" height="20" rx="10" fill="#EEF1F5"/>
  <text x="706" y="366" class="chip" text-anchor="middle" fill="#475569">BERTopic</text>

  <rect x="808" y="236" width="160" height="150" rx="12" fill="#F5F7FF" stroke="#3B5BDB" stroke-width="1.6"/>
  <circle cx="826" cy="257" r="11" fill="#3B5BDB"/>
  <text x="826" y="261.5" class="badge" text-anchor="middle">5</text>
