  <text x="1020" y="286" class="b">Next.js, static</text>
  <text x="1020" y="303" class="b">served by nginx</text>
  <text x="1020" y="320" class="b">reads latest.json</text>
  <rect x="1020" y="352" width="84" height="20" rx="10" fill="#D3F9D8"/>
  <text x="1062" y="366" class="chip" text-anchor="middle" fill="#2B8A3E">no tracking</text>

