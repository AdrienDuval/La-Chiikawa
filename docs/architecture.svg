  <rect x="1210" y="271" width="130" height="80" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1222" y="300" class="h14">Readers</text>
  <text x="1222" y="320" class="b">any browser</text>

  <rect x="1210" y="682" width="130" height="78" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
