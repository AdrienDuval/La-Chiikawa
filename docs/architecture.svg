  <text x="820" y="320" class="b">JSON, archives it</text>
  <rect x="820" y="352" width="90" height="20" rx="10" fill="#E0E7FF"/>
  <text x="865" y="366" class="chip" text-anchor="middle" fill="#3B5BDB">before 07:00</text>

  <rect x="1008" y="236" width="160" height="150" rx="12" fill="#F0FAF4" stroke="#2F9E44" stroke-width="1.6"/>
