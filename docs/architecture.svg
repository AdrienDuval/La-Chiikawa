  <text x="420" y="511" class="mono" style="font-size:13px;font-weight:700;fill:#495057">silver/</text>
  <text x="420" y="530" class="b">Parquet, zstd</text>
  <text x="420" y="547" class="b">no duplicates</text>
  <text x="420" y="564" class="b">by publish day</text>
  <text x="420" y="581" class="b">rebuilt from bronze</text>

  <rect x="608" y="464" width="160" height="128" rx="12" fill="#F3F0FF" stroke="#7048E8" stroke-width="1.6"/>
  <text x="620" y="490" class="h">Models</text>
  <text x="620" y="511" class="mono" style="font-size:13px;font-weight:700;fill:#5F3DC4">mlflow/</text>
  <text x="620" y="530" class="b">MLflow registry</text>
  <text x="620" y="547" class="b">runs + versions</text>
  <text x="620" y="564" class="b">1-step rollback</text>

  <rect x="808" y="464" width="160" height="128" rx="12" fill="#FFF9DB" stroke="#D4A017" stroke-width="1.6"/>
  <text x="820" y="490" class="h">Published</text>
  <text x="820" y="511" class="mono" style="font-size:13px;font-weight:700;fill:#9C7A00">gold/</text>
  <text x="820" y="530" class="b">edition JSON per day</text>
  <text x="820" y="547" class="b">latest.json</text>
  <text x="820" y="564" class="b">full archive</text>
  <text x="820" y="581" class="b">site reads only gold</text>

  <rect x="1008" y="464" width="160" height="128" rx="12" fill="#E6F7F8" stroke="#1098AD" stroke-width="1.6"/>
  <text x="1020" y="490" class="h" style="fill:#0B7285">PostgreSQL</text>
  <text x="1020" y="511" class="b">collector state</text>
  <text x="1020" y="528" class="b">list of editions</text>
  <text x="1020" y="545" class="b">Airflow + MLflow</text>
  <text x="1020" y="562" class="b">metadata</text>

  <!-- Row C: monitoring -->
  <rect x="30" y="666" width="1146" height="180" rx="14" fill="#FFF8F0" stroke="#F08C00" stroke-width="1.2"/>
  <circle cx="50" cy="828" r="11" fill="#3B5BDB"/>
  <text x="50" y="832.5" class="badge" text-anchor="middle">6</text>
  <text x="68" y="832" class="cap" style="fill:#C2410C">MONITORING · WATCHES EVERY PART AND ALERTS THE TEAM</text>

  <rect x="38" y="682" width="330" height="78" rx="10" fill="#FFFFFF" stroke="#F08C00" stroke-width="1.4"/>
  <text x="50" y="706" class="h14">statsd-exporter · Pushgateway</text>
  <text x="50" y="726" class="b">Airflow run metrics, and pipeline metrics:</text>
