  <text x="220" y="511" class="mono" style="font-size:13px;font-weight:700;fill:#9A5418">bronze/</text>
  <text x="220" y="530" class="b">Parquet, zstd</text>
  <text x="220" y="547" class="b">append-only</text>
  <text x="220" y="564" class="b">by fetch day,</text>
  <text x="220" y="581" class="b">merged nightly</text>

  <rect x="408" y="464" width="160" height="128" rx="12" fill="#F1F3F5" stroke="#868E96" stroke-width="1.6"/>
