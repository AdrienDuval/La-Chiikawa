[project]
name = "chiikawa"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Adrien Duval", email = "adrienmbah19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "mlflow>=3.1.0",
    "scikit-learn>=1.6.0",
]

[project.optional-dependencies]
topics = [
    "bertopic>=0.17.0",
    "umap-learn>=0.5.7",
]

[project.scripts]
chiikawa = "chiikawa:main"
chiikawa-topics = "chiikawa.topics:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
