name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest


  docker:
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v5

      - name: build the image
        run: docker build -t chiikawa .

      - name: Run the image
        run: docker run --rm chiikawa